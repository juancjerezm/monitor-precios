<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Precios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        nav { background: #1e293b; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; border-bottom: 1px solid #334155; }
        nav a { color: #94a3b8; text-decoration: none; font-weight: 500; }
        nav a:hover, nav a.active { color: #38bdf8; }
        nav .brand { color: #38bdf8; font-size: 1.2rem; font-weight: 700; margin-right: auto; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        h1 { margin-bottom: 1.5rem; color: #f1f5f9; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .stat { text-align: center; }
        .stat .num { font-size: 2rem; font-weight: 700; color: #38bdf8; }
        .stat .label { color: #64748b; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.75rem; background: #0f172a; color: #64748b; font-weight: 600; }
        td { padding: 0.75rem; border-top: 1px solid #334155; }
        tr:hover { background: #0f172a; }
        .btn { display: inline-block; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-blue:hover { background: #1d4ed8; }
        .btn-green { background: #16a34a; color: white; }
        .btn-green:hover { background: #15803d; }
        .btn-red { background: #dc2626; color: white; }
        .btn-red:hover { background: #b91c1c; }
        .btn-outline { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
        .btn-outline:hover { background: #334155; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: #064e3b; color: #6ee7b7; }
        .badge-red { background: #7f1d1d; color: #fca5a5; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        input { padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        label { font-weight: 600; color: #94a3b8; font-size: 0.85rem; margin-bottom: -0.8rem; }
        .actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
        .empty { text-align: center; padding: 3rem; color: #64748b; }
        .precio { font-weight: 700; color: #4ade80; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">📊 Monitor de Precios</span>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/sitios" class="{% if request.url.path == '/sitios' %}active{% endif %}">Sitios</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
